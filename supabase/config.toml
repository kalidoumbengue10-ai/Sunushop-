project_id = "sunushop"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://app.sunushop.fr"
additional_redirect_urls = [
  "https://app.sunushop.fr/auth/callback",
  "http://127.0.0.1:3000/auth/callback",
  "http://127.0.0.1:3000/**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/**",
  "http://127.0.0.1:3107/auth/callback",
  "http://127.0.0.1:3107/**"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

# En production, Supabase Auth envoie les emails via Resend.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "contact@sunushop.fr"
sender_name = "SunuShop"

[auth.email.template.confirmation]
subject = "Confirmez votre adresse e-mail SunuShop"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Réinitialisez votre mot de passe SunuShop"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirmez votre nouvelle adresse e-mail"
content_path = "./supabase/templates/email-change.html"

[auth.email.template.invite]
subject = "Vous êtes invité(e) sur SunuShop"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Votre lien de connexion SunuShop"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.reauthentication]
subject = "{{ .Token }} est votre code de vérification SunuShop"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Votre mot de passe SunuShop a été modifié"
content_path = "./templates/password-changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Votre adresse e-mail SunuShop a été modifiée"
content_path = "./templates/email-changed.html"

[auth.email.notification.mfa_factor_enrolled]
enabled = true
subject = "Une vérification renforcée a été ajoutée"
content_path = "./templates/mfa-enrolled.html"

[auth.email.notification.mfa_factor_unenrolled]
enabled = true
subject = "Une vérification renforcée a été retirée"
content_path = "./templates/mfa-unenrolled.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
email_sent = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[analytics]
enabled = false
